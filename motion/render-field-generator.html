<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>field render v2 generator</title>
<style>html,body{margin:0;height:100%;background:#0a0c0e;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Terrain v2: two ridge systems frame a valley opening to a warm horizon.
// Elevation-graded wireframe, horizon glow, floating motes, survey posts.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=mulberry32(2209);
const P=new Array(512);for(let i=0;i<512;i++)P[i]=rand();
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const s=(a,b)=>P[(((a&255)*97+(b&255)*57)|0)&511];
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return s(xi,yi)*(1-u)*(1-v)+s(xi+1,yi)*u*(1-v)+s(xi,yi+1)*(1-u)*v+s(xi+1,yi+1)*u*v;
}
function fbm(x,y){let a=0,amp=.5,f=1;for(let o=0;o<5;o++){a+=amp*vnoise(x*f,y*f);amp*=.5;f*=2.1}return a}
// ridged: sharp crests
function ridged(x,y){let a=0,amp=.55,f=1;for(let o=0;o<5;o++){const n=1-Math.abs(vnoise(x*f,y*f)*2-1);a+=amp*n*n;amp*=.5;f*=2.05}return a}

const W=2560,H=1440;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H,false);renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
renderer.domElement.style.width='100vw';renderer.domElement.style.height='100vh';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0c0e);
scene.fog=new THREE.FogExp2(0x0a0c0e,0.0082);

const camera=new THREE.PerspectiveCamera(40,W/H,0.1,700);
camera.position.set(0,19,70);
camera.lookAt(0,1,-70);

function height(x,z){
  // valley profile: low center, ridge walls left/right, rising away from camera
  const wall=Math.pow(Math.min(1,Math.abs(x)/110),1.6)*26;
  let h=ridged(x*0.013+7.1,z*0.013+3.9)*20-6;
  h+=fbm(x*0.05+1.3,z*0.05+8.8)*4-2;
  h=h*0.55+wall*(0.55+ridged(x*0.02+2.2,z*0.02)*0.45);
  // quiet apron near camera
  const d=Math.sqrt((x*0.75)**2+((z-62)*1.5)**2);
  h*=Math.min(1,Math.max(.10,(d-14)/85));
  return h;
}

const geo=new THREE.PlaneGeometry(420,260,340,210);
geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;
let hmin=1e9,hmax=-1e9;
for(let i=0;i<pos.count;i++){
  const h=height(pos.getX(i),pos.getZ(i));
  pos.setY(i,h); if(h<hmin)hmin=h; if(h>hmax)hmax=h;
}
geo.computeVertexNormals();

const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
  color:0x14191f,metalness:0.5,roughness:0.66,flatShading:true
}));
scene.add(terrain);

// elevation-graded wireframe: crests bright steel, floors near-invisible
const wgeo=geo.clone();
const colors=new Float32Array(wgeo.attributes.position.count*3);
const lo=new THREE.Color(0x1c2228), hi=new THREE.Color(0x5f6d7a);
for(let i=0;i<wgeo.attributes.position.count;i++){
  const t=Math.pow((wgeo.attributes.position.getY(i)-hmin)/(hmax-hmin),1.35);
  const c=lo.clone().lerp(hi,t);
  colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
}
wgeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
const wire=new THREE.Mesh(wgeo,new THREE.MeshBasicMaterial({
  vertexColors:true,wireframe:true,transparent:true,opacity:0.34
}));
wire.position.y=0.22;
scene.add(wire);

// warm horizon glow: canvas radial-gradient sprite far down the valley
{
  const cv=document.createElement('canvas');cv.width=cv.height=256;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(128,128,4,128,128,128);
  g.addColorStop(0,'rgba(213,128,66,0.55)');
  g.addColorStop(0.35,'rgba(178,98,48,0.22)');
  g.addColorStop(1,'rgba(178,98,48,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
  const tex=new THREE.CanvasTexture(cv);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  spr.position.set(-6,10,-215);
  spr.scale.set(210,115,1);
  scene.add(spr);
}

// lights
scene.add(new THREE.HemisphereLight(0x36404b,0x06080b,0.75));
const rake=new THREE.DirectionalLight(0xd58042,1.5);
rake.position.set(-150,55,-120);scene.add(rake);
const back=new THREE.DirectionalLight(0xc97435,0.55);
back.position.set(0,26,-200);scene.add(back); // valley backlight off the glow
const fill=new THREE.DirectionalLight(0x54626f,0.7);
fill.position.set(120,60,40);scene.add(fill);

// floating motes: steel dust with a few signal embers
{
  const n=210,pts=new Float32Array(n*3),cols=new Float32Array(n*3);
  const steel=new THREE.Color(0x6a7683),ember=new THREE.Color(0xd58042);
  for(let i=0;i<n;i++){
    pts[i*3]=(rand()*2-1)*180;
    pts[i*3+1]=2+rand()*46;
    pts[i*3+2]=30-rand()*220;
    const c=rand()<0.16?ember:steel;
    cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pts,3));
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));
  const dot=document.createElement('canvas');dot.width=dot.height=64;
  const dctx=dot.getContext('2d');
  const dg=dctx.createRadialGradient(32,32,2,32,32,32);
  dg.addColorStop(0,'rgba(255,255,255,1)');dg.addColorStop(0.5,'rgba(255,255,255,.4)');dg.addColorStop(1,'rgba(255,255,255,0)');
  dctx.fillStyle=dg;dctx.fillRect(0,0,64,64);
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:2.2,map:new THREE.CanvasTexture(dot),vertexColors:true,transparent:true,opacity:0.55,depthWrite:false,sizeAttenuation:true})));
}

// survey posts on crests
const markerMat=new THREE.MeshBasicMaterial({color:0xd98b4a});
for(const [mx,mz] of [[-92,-70],[-58,-130],[64,-95],[104,-45],[-30,-38]]){
  const h=height(mx,mz);
  const post=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.10,8,6),markerMat);
  post.position.set(mx,h+4,mz);scene.add(post);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(0.55,10,10),markerMat);
  tip.position.set(mx,h+8.4,mz);scene.add(tip);
}

renderer.render(scene,camera);
window.__renderDone=true;
</script>
</body>
</html>
