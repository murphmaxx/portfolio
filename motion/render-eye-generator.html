<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eye render generator</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Cyber Eye of Ra — two passes from one camera:
//   frame: lids, socket, lashes, Ra marks, reticle — everything but the iris
//   iris:  machined blade rings + pupil, rendered alone on transparency
const SIZE=1400;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(SIZE,SIZE,false);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000,0);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const HALF=3.7; // world half-height visible on the square canvas
const camera=new THREE.PerspectiveCamera(30,1,0.1,100);
camera.position.set(0,0,HALF/Math.tan(THREE.Math.degToRad(15)));
camera.lookAt(0,0,0);

// palette
const STEEL=0x46525c, STEEL_DIM=0x333c44, SIGNAL=0xc97435, SIGNAL_2=0xe0965a, DARK=0x0d1013;

scene.add(new THREE.HemisphereLight(0x39434e,0x07090c,1.1));
const rake=new THREE.DirectionalLight(0xd58042,2.6); rake.position.set(-30,8,18); scene.add(rake);
const fill=new THREE.DirectionalLight(0x54626f,0.8); fill.position.set(25,12,20); scene.add(fill);

const mat={
  steel:new THREE.MeshBasicMaterial({color:STEEL}),
  steelDim:new THREE.MeshBasicMaterial({color:STEEL_DIM}),
  signal:new THREE.MeshBasicMaterial({color:SIGNAL}),
  signal2:new THREE.MeshBasicMaterial({color:SIGNAL_2}),
  blade:new THREE.MeshBasicMaterial({color:0x3d4854}),
  rim:new THREE.MeshStandardMaterial({color:0x252c33,metalness:0.7,roughness:0.45,flatShading:true}),
  socket:new THREE.MeshBasicMaterial({color:DARK}),
};

function tube(points,r,m,closed){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)),!!closed);
  return new THREE.Mesh(new THREE.TubeGeometry(curve,120,r,8,!!closed),m);
}
// lens-shaped lid arc: circle of radius R centered at (0,cy), spanning x in [-w,w]
function lidArc(w,bulge,r,m){
  const R=(w*w+bulge*bulge)/(2*bulge);
  const cy=bulge-R; // arc peaks at y=bulge, ends at (±w,0)
  const a=Math.asin(w/R);
  const pts=[];
  for(let i=0;i<=60;i++){
    const t=-a+(2*a)*(i/60);
    pts.push([R*Math.sin(t),cy+R*Math.cos(t),0]);
  }
  return tube(pts,r,m);
}

/* ============ FRAME GROUP ============ */
const frame=new THREE.Group();

// lids: asymmetric almond, doubled lines
const W=2.85;
frame.add(lidArc(W,1.62,0.020,mat.steel));                       // upper lid
const lower=lidArc(W,1.30,0.020,mat.steel); lower.scale.y=-1; frame.add(lower);
const up2=lidArc(W*0.94,1.46,0.009,mat.steelDim); up2.position.y=-0.02; frame.add(up2);
const lo2=lidArc(W*0.94,1.16,0.009,mat.steelDim); lo2.scale.y=-1; lo2.position.y=0.02; frame.add(lo2);

// socket: dark recessed disc + thin ring (iris sits over this)
const socket=new THREE.Mesh(new THREE.CircleGeometry(1.16,72),mat.socket);
socket.position.z=-0.05; frame.add(socket);
const socketRing=new THREE.Mesh(new THREE.TorusGeometry(1.18,0.008,8,96),mat.steelDim);
frame.add(socketRing);

// lash ticks along the upper lid
{
  const R=(W*W+1.62*1.62)/(2*1.62), cy=1.62-R, a=Math.asin(W/R);
  for(let i=1;i<=9;i++){
    const t=-a+(2*a)*(i/10);
    const x=R*Math.sin(t), y=cy+R*Math.cos(t);
    const tick=new THREE.Mesh(new THREE.BoxGeometry(0.016,0.14,0.016),mat.steel);
    tick.position.set(x,y+0.09,0);
    tick.rotation.z=-Math.sin(t)*0.5;
    frame.add(tick);
  }
}

// Ra mark 1: teardrop descending from the inner (left) lower lid, ending in a curl
frame.add(tube([[-1.05,-1.02,0],[-1.08,-1.9,0],[-1.12,-2.55,0],[-1.35,-2.92,0],[-1.68,-2.85,0],[-1.78,-2.55,0],[-1.60,-2.38,0]],0.016,mat.steel));
const drop=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,10),mat.signal);
drop.position.set(-1.60,-2.38,0); frame.add(drop);

// Ra mark 2: diagonal stroke sweeping down-right from the outer lower lid
frame.add(tube([[1.35,-0.98,0],[1.95,-1.75,0],[2.45,-2.25,0]],0.016,mat.steel));
frame.add(tube([[1.35,-0.98,0],[1.75,-1.85,0],[1.95,-2.45,0]],0.010,mat.steelDim));

// brow: single slim arc above
const brow=lidArc(W*1.02,1.55,0.012,mat.steelDim); brow.position.y=0.55; frame.add(brow);

// HUD reticle: partial orange arcs + ticks orbiting the socket
function arcRing(radius,thick,start,len,m,rz){
  const g=new THREE.TorusGeometry(radius,thick,6,64,len);
  const mesh=new THREE.Mesh(g,m); mesh.rotation.z=start; if(rz)mesh.rotation.z+=rz;
  return mesh;
}
frame.add(arcRing(1.34,0.010,2.35,1.15,mat.signal));
frame.add(arcRing(1.34,0.010,-0.75,0.85,mat.signal));
frame.add(arcRing(1.42,0.006,0.35,0.5,mat.steelDim));
for(const ang of [0.1,1.05,2.6,3.6,4.5,5.4]){
  const tick=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.014,0.014),mat.steel);
  tick.position.set(Math.cos(ang)*1.42,Math.sin(ang)*1.42,0);
  tick.rotation.z=ang; frame.add(tick);
}
scene.add(frame);

/* ============ IRIS GROUP ============ */
const iris=new THREE.Group();
const IRIS_R=1.05; // outer radius, world units — exported for page math

// pupil: dark disc + orange rim, slightly proud of the blade plane
const pupil=new THREE.Mesh(new THREE.CircleGeometry(0.33,64),new THREE.MeshBasicMaterial({color:0x08090b}));
pupil.position.z=0.14; iris.add(pupil);
const pupilRim=new THREE.Mesh(new THREE.TorusGeometry(0.355,0.014,8,72),mat.signal2);
pupilRim.position.z=0.14; iris.add(pupilRim);
const pupilRim2=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.006,8,72),mat.steelDim);
pupilRim2.position.z=0.12; iris.add(pupilRim2);

// machined blades: radial turbine segments, every 6th one signal orange
for(let i=0;i<64;i++){
  const ang=(i/64)*Math.PI*2;
  const orange=i%8===0;
  const blade=new THREE.Mesh(new THREE.BoxGeometry(orange?0.34:0.42,orange?0.016:0.014,0.012),orange?mat.signal:mat.blade);
  const r=orange?0.72:0.68;
  blade.position.set(Math.cos(ang)*r,Math.sin(ang)*r,0.05);
  blade.rotation.z=ang;
  iris.add(blade);
}
// ring layers
const r1=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.008,8,96),mat.steelDim); r1.position.z=0.09; iris.add(r1);
const r2=new THREE.Mesh(new THREE.TorusGeometry(0.93,0.007,8,96),mat.steelDim); r2.position.z=0.03; iris.add(r2);
const rimOuter=new THREE.Mesh(new THREE.TorusGeometry(1.00,0.035,8,96),mat.rim); iris.add(rimOuter);
const rimGlow=new THREE.Mesh(new THREE.TorusGeometry(IRIS_R,0.009,8,96),mat.signal); iris.add(rimGlow);
// rim graduations
for(let i=0;i<24;i++){
  const ang=(i/24)*Math.PI*2;
  const tick=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.010,0.010),i%2?mat.steel:mat.signal2);
  tick.position.set(Math.cos(ang)*1.0,Math.sin(ang)*1.0,0.05);
  tick.rotation.z=ang; iris.add(tick);
}
scene.add(iris);

// pass control for the capture script
window.showPass=function(name){
  frame.visible=(name==='frame'||name==='both');
  iris.visible=(name==='iris'||name==='both');
  renderer.render(scene,camera);
  return true;
};
// page-placement math: iris diameter as a fraction of the square canvas
window.__irisFraction=(2*(IRIS_R+0.05))/(2*HALF);
renderer.render(scene,camera);
window.__renderDone=true;
</script>
</body>
</html>
