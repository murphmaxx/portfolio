<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eye render v2 generator</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Cyber eye v2 — pure 3D, no flourishes. Three passes from one camera:
//   frame: thick machined lids + canthus caps + recessed socket bowl
//   iris:  domed turbine iris in a barrel housing
//   glint: static specular arcs (page layers them above the moving iris)
const SIZE=1400;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(SIZE,SIZE,false);renderer.setPixelRatio(1);
renderer.setClearColor(0x000000,0);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const HALF=3.7;
const camera=new THREE.PerspectiveCamera(30,1,0.1,100);
camera.position.set(0,0,HALF/Math.tan(THREE.Math.degToRad(15)));
camera.lookAt(0,0,0);

// lights: warm key upper-left-front, steel fill right, faint under-rim
scene.add(new THREE.HemisphereLight(0x39434e,0x07090c,0.9));
const key=new THREE.DirectionalLight(0xd58042,2.2); key.position.set(-16,14,22); scene.add(key);
const fill=new THREE.DirectionalLight(0x54626f,0.9); fill.position.set(18,4,20); scene.add(fill);
const under=new THREE.DirectionalLight(0x39434e,0.5); under.position.set(4,-16,14); scene.add(under);

const mat={
  lid:new THREE.MeshStandardMaterial({color:0x2b333c,metalness:0.75,roughness:0.32,flatShading:false}),
  groove:new THREE.MeshBasicMaterial({color:0x46525c}),
  bowl:new THREE.MeshStandardMaterial({color:0x0c1014,metalness:0.35,roughness:0.8,side:THREE.DoubleSide}),
  barrel:new THREE.MeshStandardMaterial({color:0x232b33,metalness:0.7,roughness:0.4,flatShading:true}),
  blade:new THREE.MeshStandardMaterial({color:0x3a444f,metalness:0.7,roughness:0.35,flatShading:true}),
  signal:new THREE.MeshBasicMaterial({color:0xc97435}),
  signal2:new THREE.MeshBasicMaterial({color:0xe0965a}),
};

function lidCurve(w,bulge,segs){
  const R=(w*w+bulge*bulge)/(2*bulge), cy=bulge-R, a=Math.asin(w/R), pts=[];
  for(let i=0;i<=segs;i++){
    const t=-a+(2*a)*(i/segs);
    pts.push(new THREE.Vector3(R*Math.sin(t),cy+R*Math.cos(t),0));
  }
  return new THREE.CatmullRomCurve3(pts);
}
function lidTube(w,bulge,r,m,flipY){
  const c=lidCurve(w,bulge,60);
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(c,90,r,12),m);
  if(flipY)mesh.scale.y=-1;
  return mesh;
}

/* ============ FRAME ============ */
const frame=new THREE.Group();
const W=2.85;

// thick machined lids
frame.add(lidTube(W,1.62,0.075,mat.lid,false));
frame.add(lidTube(W,1.30,0.075,mat.lid,true));
// machined groove lines riding the lids
frame.add(lidTube(W*0.985,1.545,0.010,mat.groove,false));
frame.add(lidTube(W*0.985,1.235,0.010,mat.groove,true));

// canthus caps where the lids meet
for(const sx of [-1,1]){
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.115,18,18),mat.lid);
  cap.position.set(sx*W,0,0);
  frame.add(cap);
  const dot=new THREE.Mesh(new THREE.SphereGeometry(0.032,10,10),mat.signal2);
  dot.position.set(sx*(W+0.02),0,0.10);
  frame.add(dot);
}

// recessed socket bowl: lathe profile, concave toward the viewer
{
  const prof=[];
  for(let i=0;i<=24;i++){
    const t=i/24;                     // 0 center -> 1 rim
    const r=1.30*t;
    const z=-0.62*(1-t*t);            // deepest at center
    prof.push(new THREE.Vector2(r,z));
  }
  const bowl=new THREE.Mesh(new THREE.LatheGeometry(prof,84),mat.bowl);
  bowl.rotation.x=Math.PI/2;          // lathe axis -> z, concave toward camera
  frame.add(bowl);
}
// housing ring bridging bowl to lids
const housing=new THREE.Mesh(new THREE.TorusGeometry(1.30,0.045,10,96),mat.barrel);
frame.add(housing);

scene.add(frame);

/* ============ IRIS ============ */
const iris=new THREE.Group();
const IRIS_R=1.05;

// barrel wall: short cylinder, open toward viewer
const wall=new THREE.Mesh(new THREE.CylinderGeometry(IRIS_R,IRIS_R,0.34,72,1,true),mat.barrel);
wall.rotation.x=Math.PI/2;
wall.position.z=-0.05;
iris.add(wall);

// pupil: dark disc set deep + orange rim proud of it
const pupil=new THREE.Mesh(new THREE.CircleGeometry(0.30,64),new THREE.MeshBasicMaterial({color:0x07080a}));
pupil.position.z=0.02; iris.add(pupil);
const pupilRim=new THREE.Mesh(new THREE.TorusGeometry(0.325,0.020,10,72),mat.signal2);
pupilRim.position.z=0.06; iris.add(pupilRim);

// domed turbine: blades climb from the rim toward the pupil
for(let i=0;i<64;i++){
  const ang=(i/64)*Math.PI*2;
  const orange=i%8===0;
  const len=orange?0.36:0.44;
  const blade=new THREE.Mesh(new THREE.BoxGeometry(len,orange?0.017:0.015,0.014),orange?mat.signal:mat.blade);
  const r=0.67;
  blade.position.set(Math.cos(ang)*r,Math.sin(ang)*r,-0.06);
  blade.rotation.z=ang;
  blade.rotation.y=Math.cos(ang)*-0.38;  // tilt toward center dome
  blade.rotation.x=Math.sin(ang)*0.38;
  iris.add(blade);
}
// concentric rings on the dome
const ri=new THREE.Mesh(new THREE.TorusGeometry(0.52,0.010,8,96),mat.groove); ri.position.z=0.0; iris.add(ri);
const ro=new THREE.Mesh(new THREE.TorusGeometry(0.90,0.012,8,96),mat.groove); ro.position.z=-0.10; iris.add(ro);
// outer rim ring + signal glow ring
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.00,0.055,10,96),mat.barrel); rim.position.z=0.10; iris.add(rim);
const glow=new THREE.Mesh(new THREE.TorusGeometry(IRIS_R,0.010,8,96),mat.signal); glow.position.z=0.13; iris.add(glow);
// rim graduations
for(let i=0;i<24;i++){
  const ang=(i/24)*Math.PI*2;
  const tick=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.011,0.011),i%2?mat.groove:mat.signal2);
  tick.position.set(Math.cos(ang)*1.0,Math.sin(ang)*1.0,0.155);
  tick.rotation.z=ang;iris.add(tick);
}
scene.add(iris);

/* ============ GLINT ============ */
const glint=new THREE.Group();
{
  const g1=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.018,8,64,0.9),new THREE.MeshBasicMaterial({color:0xf3e2cf,transparent:true,opacity:0.8}));
  g1.rotation.z=1.85; g1.position.z=0.30; glint.add(g1);
  const g2=new THREE.Mesh(new THREE.TorusGeometry(0.50,0.010,8,64,0.5),new THREE.MeshBasicMaterial({color:0xf3e2cf,transparent:true,opacity:0.45}));
  g2.rotation.z=2.45; g2.position.z=0.30; glint.add(g2);
  const spot=new THREE.Mesh(new THREE.SphereGeometry(0.045,12,12),new THREE.MeshBasicMaterial({color:0xf8ece0,transparent:true,opacity:0.9}));
  spot.position.set(-0.38,0.42,0.32); glint.add(spot);
}
scene.add(glint);

window.showPass=function(name){
  frame.visible=(name==='frame'||name==='both');
  iris.visible=(name==='iris'||name==='both');
  glint.visible=(name==='glint'||name==='both');
  renderer.render(scene,camera);
  return true;
};
window.__irisFraction=(2*(IRIS_R+0.05))/(2*HALF);
renderer.render(scene,camera);
window.__renderDone=true;
</script>
</body>
</html>
